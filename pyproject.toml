[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcp-epcseg"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "scikit-learn", "biopython>=1.84", "psutil", "torch>=2.7"]

[tool.setuptools.packages.find]
include = ["pcp*"]
